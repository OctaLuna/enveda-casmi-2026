name: Release Submission Packaging

on:
  push:
    tags:
      - 'sub-[0-9]+-[0-9]+'

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Release Artifacts
        run: |
          python .agents/bin/run_checks.py pre-submit

